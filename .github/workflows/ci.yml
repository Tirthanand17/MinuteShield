name: MinuteShield CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
concurrency:
  group: minuteshield-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify release bundle
        run: test -s dist/index.js
      - name: Commit generated bundle and lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/index.js dist/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Generated bundle is already current."
            exit 0
          fi
          git commit -m "chore: refresh action bundle"
          git push
