name: MinuteShield
on:
  pull_request:
    paths:
      - '.github/workflows/**'
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: minuteshield-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cost-guard:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: YOUR_ORG/minuteshield@v1
        with:
          github-token: ${{ github.token }}
